name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create Android scaffolding
        run: flutter create --platforms=android --org com.krishnaapp --project-name krishna_app .

      - name: Configure Android manifest
        run: |
          MANIFEST=android/app/src/main/AndroidManifest.xml
          sed -i 's#<application#<uses-permission android:name="android.permission.INTERNET"/>\n    <application#' $MANIFEST
          sed -i 's#android:label="[^"]*"#android:label="Shri Krishna"#' $MANIFEST

      - run: flutter pub get

      - name: Generate app icons
        run: dart run flutter_launcher_icons

      - run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: krishna-app-apk
          path: build/app/outputs/flutter-apk/app-release.apk
