name: krishna_app
description: Shri Krishna - life, stories, Gita, festivals, places and bhajans.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  google_fonts: ^6.2.1
  flutter_tts: ^4.2.0
  shared_preferences: ^2.3.2
  url_launcher: ^6.3.0
  android_intent_plus: ^5.0.0

dev_dependencies:
  flutter_launcher_icons: ^0.14.1

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "icon.png"
  adaptive_icon_background: "#101A3A"
  adaptive_icon_foreground: "icon_foreground.png"

flutter:
  uses-material-design: true
  assets:
    - father_photo.jpg
